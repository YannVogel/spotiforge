<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Spotiforge · Braise — Création</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&amp;family=Barlow:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0A0806}
a{color:inherit}a:hover{color:#FFC43D}
@keyframes ember{0%,100%{opacity:.75}50%{opacity:1}}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 1000px; box-sizing: border-box; overflow: hidden; background: #0A0806; color: #F6EDE3; font-family: 'Barlow', system-ui, sans-serif; padding: 12px 20px 24px; display: flex; flex-direction: column; gap: 15px">

  <div aria-hidden="true" style="position: absolute; left: -80px; right: -80px; bottom: -260px; height: 560px; background: radial-gradient(ellipse at 50% 100%, rgba(255,196,61,0.55) 0%, rgba(255,90,31,0.42) 28%, rgba(180,30,8,0.22) 52%, rgba(10,8,6,0) 72%); animation: ember 3.2s ease-in-out infinite; pointer-events: none"></div>
  <div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 0; bottom: 0; background-image: radial-gradient(circle at 30px 620px, #FFC43D 0, #FFC43D 1.5px, transparent 2px), radial-gradient(circle at 300px 540px, #FF8A3D 0, #FF8A3D 1.2px, transparent 2px), radial-gradient(circle at 352px 700px, #FFC43D 0, #FFC43D 1px, transparent 2px), radial-gradient(circle at 96px 760px, #FF5A1F 0, #FF5A1F 1.6px, transparent 2.2px), radial-gradient(circle at 210px 470px, #FFC43D 0, #FFC43D 0.9px, transparent 1.6px); pointer-events: none"></div>

  <header style="position: relative; display: flex; align-items: center; justify-content: space-between; min-height: 44px">
    <span style="display: flex; align-items: center; gap: 8px; font-family: 'Big Shoulders Display', Impact, sans-serif; font-weight: 900; font-size: 22px; letter-spacing: 0.1em">
      <span aria-hidden="true" style="width: 10px; height: 10px; border-radius: 5px; background: #FF5A1F; box-shadow: 0 0 12px 3px rgba(255,90,31,0.8)"></span>
      SPOTIFORGE
    </span>
    <a href="#" style="min-height: 44px; display: flex; align-items: center; font-size: 14px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #D9CBBB; text-decoration: none">Mes pièces</a>
  </header>

  <h1 style="position: relative; margin: 0; font-family: 'Big Shoulders Display', Impact, sans-serif; font-weight: 900; font-size: 74px; line-height: 0.84; letter-spacing: -0.01em; text-transform: uppercase; color: #FF8A3D; background: linear-gradient(to bottom, #FFF3C4 0%, #FFC43D 30%, #FF5A1F 68%, #B41E08 100%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent">Qu’est-ce<br>qu’on<br>forge&nbsp;?</h1>

  <div style="position: relative; display: flex; flex-direction: column; gap: 6px; padding: 12px 14px; background: #14100C; border: 1px solid #4A3020">
    <label for="prompt-br" style="font-size: 12px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #FF8A3D">Le minerai — ton moment</label>
    <textarea id="prompt-br" rows="4" style="box-sizing: border-box; width: 100%; height: 96px; padding: 0; border: 0; resize: none; background: transparent; color: #F6EDE3; font-family: 'Barlow', system-ui, sans-serif; font-size: 16px; line-height: 1.5">Route de nuit au bord de la mer. Synthés mélancoliques, voix lointaines, et ça monte doucement vers quelque chose d’immense.</textarea>
  </div>

  <button type="button" role="switch" aria-checked="true" style="position: relative; min-height: 44px; padding: 0; border: 0; background: transparent; color: #F6EDE3; display: flex; align-items: center; justify-content: space-between; font-family: 'Barlow', system-ui, sans-serif; font-size: 16px; font-weight: 500; text-align: left; cursor: pointer">
    Alliage : mes écoutes
    <span aria-hidden="true" style="width: 54px; height: 28px; box-sizing: border-box; padding: 3px; background: #3A1C0C; border: 1px solid #FF5A1F; display: flex; justify-content: flex-end">
      <span style="width: 22px; height: 20px; background: #FF5A1F; box-shadow: 0 0 12px rgba(255,90,31,0.9); display: block"></span>
    </span>
  </button>

  <section style="position: relative; display: flex; flex-direction: column; gap: 2px">
    <div style="display: flex; justify-content: space-between; align-items: baseline">
      <h2 style="margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #D9CBBB">Longueur de la barre</h2>
      <span style="font-family: 'Big Shoulders Display', Impact, sans-serif; font-weight: 900; font-size: 26px">40 MIN</span>
    </div>
    <div style="position: relative; height: 44px; display: flex; align-items: center">
      <span aria-hidden="true" style="position: absolute; left: 0; right: 0; height: 18px; background: #241A13; border: 1px solid #3D2C20; box-sizing: border-box"></span>
      <span aria-hidden="true" style="position: absolute; left: 0; width: 27%; height: 18px; background: linear-gradient(to right, #7A1608 0%, #FF5A1F 55%, #FFC43D 88%, #FFF3C4 100%); box-shadow: 0 0 18px rgba(255,120,40,0.75)"></span>
      <input type="range" min="10" max="120" step="5" value="40" aria-label="Durée en minutes" style="position: absolute; left: 0; top: 0; width: 100%; height: 44px; margin: 0; opacity: 0; cursor: pointer">
    </div>
  </section>

  <section style="position: relative; display: flex; flex-direction: column; gap: 2px">
    <div style="display: flex; justify-content: space-between; align-items: baseline">
      <h2 style="margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #D9CBBB">Température de découverte</h2>
      <span style="font-family: 'Big Shoulders Display', Impact, sans-serif; font-weight: 900; font-size: 26px">60 %</span>
    </div>
    <div style="position: relative; height: 44px; display: flex; align-items: center">
      <span aria-hidden="true" style="position: absolute; left: 0; right: 0; height: 18px; background: #241A13; border: 1px solid #3D2C20; box-sizing: border-box"></span>
      <span aria-hidden="true" style="position: absolute; left: 0; width: 60%; height: 18px; background: linear-gradient(to right, #7A1608 0%, #FF5A1F 55%, #FFC43D 88%, #FFF3C4 100%); box-shadow: 0 0 18px rgba(255,120,40,0.75)"></span>
      <input type="range" min="0" max="100" step="10" value="60" aria-label="Part de découverte en pourcentage" style="position: absolute; left: 0; top: 0; width: 100%; height: 44px; margin: 0; opacity: 0; cursor: pointer">
    </div>
    <div style="display: flex; justify-content: space-between; font-size: 13px; color: #D9CBBB">
      <span>Froid : titres connus</span>
      <span>Brûlant : inédits</span>
    </div>
  </section>

  <div role="group" aria-label="Époque" style="position: relative; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px">
    <sc-for list="{{decades}}" as="d" hint-placeholder-count="7">
      <button type="button" aria-pressed="{{d.on}}" style="height: 44px; padding: 0; border: 1px solid {{d.border}}; background: {{d.bg}}; color: {{d.fg}}; font-family: 'Big Shoulders Display', Impact, sans-serif; font-weight: 700; font-size: 18px; cursor: pointer">{{d.label}}</button>
    </sc-for>
  </div>

  <div role="group" aria-label="Progression" style="position: relative; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px">
    <sc-for list="{{shapes}}" as="s" hint-placeholder-count="4">
      <button type="button" aria-pressed="{{s.on}}" style="height: 48px; padding: 0; border: 1px solid {{s.border}}; background: {{s.bg}}; color: {{s.fg}}; font-family: 'Barlow', system-ui, sans-serif; font-size: 14px; font-weight: 600; cursor: pointer">{{s.label}}</button>
    </sc-for>
  </div>

  <a href="apercu.dc.html" style="position: relative; margin-top: auto; height: 66px; background: #FF5A1F; color: #0A0806; box-shadow: 0 0 44px rgba(255,90,31,0.7); display: flex; align-items: center; justify-content: center; font-family: 'Big Shoulders Display', Impact, sans-serif; font-weight: 900; font-size: 32px; letter-spacing: 0.06em; text-transform: uppercase; text-decoration: none">Forger la playlist</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    var on = { '80s': true, '00s': true, '10s': true };
    var decades = ['60s', '70s', '80s', '90s', '00s', '10s', '20s'].map(function (l) {
      var sel = !!on[l];
      return { label: l, on: sel, border: sel ? '#FF5A1F' : '#4A3A2E', bg: sel ? '#FF5A1F' : 'transparent', fg: sel ? '#0A0806' : '#D9CBBB' };
    });
    var shapes = ['Montée', 'Descente', 'Vague', 'Libre'].map(function (l, i) {
      var sel = i === 0;
      return { label: l, on: sel, border: sel ? '#FFC43D' : '#4A3A2E', bg: sel ? 'rgba(255,196,61,0.16)' : 'transparent', fg: sel ? '#FFC43D' : '#D9CBBB' };
    });
    return { decades: decades, shapes: shapes };
  }
}
</script>
</body>
</html>
