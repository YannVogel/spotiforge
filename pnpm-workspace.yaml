packages:
  - 'apps/*'
  - 'packages/*'

# Ajouté par pnpm : versions publiées depuis moins de 24 h (délai minimal de pnpm 11),
# requises par le SDK Expo en cours. Peut être vidé quand elles ont vieilli.
minimumReleaseAgeExclude:
  - '@expo/env@2.6.0'
  - '@expo/require-utils@58.0.6'
  - expo-constants@58.0.16
  - expo-linking@58.0.17
  - expo-router@58.0.31
  - expo-server@58.1.0
  - expo-status-bar@58.0.5
  - '@expo/cli@58.1.20'
  - '@expo/config-plugins@58.0.13'
  - '@expo/config@58.0.12'
  - '@expo/fingerprint@0.21.10'
  - '@expo/image-utils@0.12.7'
  - '@expo/inline-modules@0.2.10'
  - '@expo/local-build-cache-provider@58.0.12'
  - '@expo/metro-config@58.0.22'
  - '@expo/metro-file-map@58.0.6'
  - '@expo/plist@0.10.2'
  - '@expo/prebuild-config@58.0.20'
  - '@expo/router-server@58.0.22'
  - babel-preset-expo@58.0.25
  - expo-asset@58.0.21
  - expo-font@58.0.12
  - expo-keep-awake@58.0.4
  - expo-modules-autolinking@58.1.0
  - expo-modules-cli@0.5.0
  - expo-modules-core@58.1.0
  - expo-modules-jsi@58.0.23
  - expo@58.0.24

# Réglage par défaut de create-expo-app avec pnpm : le plus sûr pour React Native.
nodeLinker: hoisted

# Binaires natifs requis par Wrangler (bundler et runtime local du Worker).
allowBuilds:
  esbuild: true
  workerd: true
